{% set name = "duck" %}
{% set version = "0.3.0" %}

package:
  name: openduck
  version: {{ version }}

source:
  url: https://github.com/CBDD/openduck/archive/refs/heads/master.tar.gz

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"
  entry_points:
    - openduck = scripts.openduck:main
    - openmm_job_launcher = scripts.openmm_job_launcher:main
requirements:
  host:
    - python
    - pip
  run:
    - python
    - rdkit
    - cudatoolkit
    - networkx
    - yank=0.25.2
    - pdbfixer=1.7
    - openff-toolkit=0.9.0
    - parmed=3.4.3
    - cudatoolkit=11.7.0
    - openmm=7.5
    - openmmforcefields=0.9.0
    - ambertools=22.0
    - pandas
    - scipy
    - matplotlib
    - pyyaml

test:
  commands:
    - openduck -h
    - openduck openmm-full-protocol -h
    - openduck amber-prepare -h
    - openduck report -h

about:
  home: https://github.com/CBDD/openduck
  license: Apache 2.0
  license_family: Apache
  license_file: LICENSE
  summary: Open source library for dynamic undocking (DUck)
